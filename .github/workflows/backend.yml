name: Backend verification
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend examples scripts
      - run: bash -n start.sh
      - run: docker compose config --quiet
      - run: docker build -t data-analysis-sandbox:latest sandbox-runtime
      - run: PYTHONPATH=backend RUN_DOCKER_TESTS=1 RUN_STACK_TESTS=1 pytest -q
      - run: docker compose build backend frontend
      - name: Verify one-command deployment with real containers
        run: ./start.sh
      - name: Stop delivery stack (keep volumes)
        if: always()
        run: docker compose down
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
