name: data-analysis-agent

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  sandbox-executor:
    build:
      context: ./sandbox-runtime
    image: data-analysis-sandbox:latest
    command: ["-c", "print('sandbox image ready')"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    network_mode: "none"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-data-analysis-sandbox:latest}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-10}
      SANDBOX_MEMORY_LIMIT_MB: ${SANDBOX_MEMORY_LIMIT_MB:-512}
      DATASET_DIR: /app/uploads
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      API_TOKEN: ${API_TOKEN:-}
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      sandbox-executor:
        condition: service_completed_successfully
    # Development only: Docker SDK needs an engine endpoint. In production, use a
    # rootless remote Docker API restricted to the sandbox image and its options.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dataset-data:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [internal, edge]

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: ["sh", "-c", "echo 'Frontend is introduced in Phase 4'; tail -f /dev/null"]
    volumes:
      - ./frontend:/app:ro
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    restart: unless-stopped
    networks: [edge]

volumes:
  redis-data:
  dataset-data:

networks:
  internal:
    internal: true
  edge:
